<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>免费领生意诊断</title>
<link rel="stylesheet" href="css/style.css?v=40">
</head>
<body>
<div id="app">

  <!-- ========== 第一屏：痛点多选 ========== -->
  <main id="mainPage">

    <!-- 顶部信任条 -->
    <div class="top-bar">
      <span class="bar-badge">官方</span>
      <span>腾讯广告 · 生意诊断</span>
    </div>

    <!-- 标题区 -->
    <section class="hero">
      <h1 class="hero-title">
        你的生意<br>卡在哪一步？
      </h1>
      <p class="hero-sub">30 秒快速自查，免费获取诊断建议</p>
    </section>

    <!-- 痛点多选 -->
    <section class="pain-pick">
      <p class="pain-lead">以下情况，哪些和你相关？<span class="pain-hint">（可多选）</span></p>
      <div class="pain-list" id="painList">
        <!-- JS 填充 -->
      </div>
      <button class="pain-submit" id="painSubmit" disabled>
        <span class="submit-text">提交自查，查看诊断</span>
        <span class="submit-count" id="submitCount"></span>
      </button>
    </section>

  </main>

  <!-- ========== 第二屏：结果揭晓（默认隐藏） ========== -->
  <section class="result-reveal" id="resultReveal">

    <!-- 诊断结果卡 -->
    <div class="result-card" id="resultCard">
      <div class="result-header">
        <span class="result-emoji">📋</span>
        <div class="result-title-wrap">
          <p class="result-title">初步诊断结果</p>
          <p class="result-subtitle" id="resultSubtitle">你勾选了 <strong id="hitCount">0</strong> 项经营问题</p>
        </div>
      </div>
      <div class="result-hits" id="resultHits">
        <!-- JS 填充命中痛点 -->
      </div>
      <div class="result-insight">
        <p class="insight-label">💡 顾问初判</p>
        <p class="insight-text" id="insightText"></p>
      </div>
    </div>

    <!-- 福利区 -->
    <div class="freebie-reveal">
      <p class="freebie-heading">针对这些问题，你可以<strong>免费</strong>获取 👇</p>
      <div class="freebie-items">
        <div class="freebie-item" data-delay="1">
          <span class="fi-icon">📊</span>
          <div class="fi-text">
            <strong>经营问题诊断报告</strong>
            <span>定位具体卡点，给出优先级建议</span>
          </div>
          <span class="fi-tag">免费</span>
        </div>
        <div class="freebie-item" data-delay="2">
          <span class="fi-icon">📈</span>
          <div class="fi-text">
            <strong>同行业经营参考</strong>
            <span>同类型商家的实际做法和效果</span>
          </div>
          <span class="fi-tag">免费</span>
        </div>
        <div class="freebie-item" data-delay="3">
          <span class="fi-icon">📋</span>
          <div class="fi-text">
            <strong>落地执行方案</strong>
            <span>可直接上手的操作步骤</span>
          </div>
          <span class="fi-tag">免费</span>
        </div>
      </div>
    </div>

    <!-- 加微 CTA -->
    <section class="cta-section">
      <div class="cta-card">
        <div class="cta-qr">
          <div class="qr-box">
            <span>顾问二维码</span>
            <span class="qr-hint">长按识别添加</span>
          </div>
        </div>
        <div class="cta-right">
          <p class="cta-main">添加顾问，<strong>免费领取全部资料</strong></p>
          <p class="cta-sub">一对一沟通，不收费、不推销</p>
          <div class="cta-urgency">
            <span class="urgency-dot"></span>
            <span>今日剩余名额：<strong id="quota">23</strong> 个</span>
          </div>
        </div>
      </div>
      <div class="cta-social">
        <span class="social-avatars">
          <i class="av" style="background:#FF6B6B"></i>
          <i class="av" style="background:#4ECDC4"></i>
          <i class="av" style="background:#45B7D1"></i>
          <i class="av" style="background:#96CEB4"></i>
          <i class="av" style="background:#FFA07A"></i>
        </span>
        <span class="social-num" id="socialText">2,847 位老板已领取</span>
      </div>
    </section>

    <!-- 底部信任 -->
    <footer class="trust-footer">
      <div class="trust-tags">
        <span>✅ 全程免费</span>
        <span>✅ 不做推销</span>
        <span>✅ 随时可删</span>
      </div>
      <p class="trust-sub">反正不花钱，领了不亏</p>
    </footer>

  </section>

</div>
<script src="js/main.js?v=40"></script>
</body>
</html>
